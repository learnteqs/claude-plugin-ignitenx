name: ignitenx-tm

on:
  pull_request:
    paths:
      - "plugins/ignitenx-tm/**"
      - ".claude-plugin/marketplace.json"
      - ".github/workflows/ignitenx-tm.yml"
  push:
    branches: [main]
    paths:
      - "plugins/ignitenx-tm/**"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/ignitenx-tm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugins/ignitenx-tm/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # The committed bundles are what the plugin runs, so they must match the source exactly, and none may be untracked.
      - run: test -z "$(git status --porcelain --ignored -- dist)" || { git status --porcelain --ignored -- dist; exit 1; }
      - run: npm test
      # Pinned to the version the headless proof was last run with; bump it together with a fresh proof run.
      - run: npx --yes @anthropic-ai/claude-code@2.1.282 plugin validate --strict .
      - run: npx --yes @anthropic-ai/claude-code@2.1.282 plugin validate ../..
